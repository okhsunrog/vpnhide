[workspace]
resolver = "3"
members = [
    "crates/apatch-abi",
    "crates/activator",
    "crates/native-policy",
    "crates/migration-policy",
    "crates/provisioning",
    "crates/loader-ipc",
    "crates/diagnostic-model",
    "crates/checks",
    "crates/core-rpc",
    "crates/core-daemon",
    "crates/core-ffi",
    "crates/core-client",
    "crates/protocol",
    "crates/protocol-diff",
    "zygisk",
]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
panic = "abort"

# Android app native artifacts unwind across the typed FFI so failures can be
# reported without aborting the app. Every APK entry point selects this profile.
[profile.app-native]
inherits = "release"
opt-level = "z"
panic = "unwind"
