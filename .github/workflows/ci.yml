name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  RUFF_VERSION: "0.16.3"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  builtin-integrator:
    needs: changes
    if: needs.changes.outputs.builtin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"
      - run: uv run --python 3.12 --no-project python -m unittest discover -s builtin/scripts -p 'test_*.py' -v


  # Decide which areas this run exercises. A pull request runs the jobs whose
  # paths changed, plus everything an area shares: the code generators, the
  # kernel side and the QEMU probes (`shared`, which also starts the QEMU
  # matrix) and the Rust workspace (`shared_rust`: the activator every zip
  # bundles, so every area packages, but no QEMU kernel runs it). An `area:*`
  # label forces that area and `ci:full` forces everything, whatever the diff;
  # a change under .github runs everything; pushes to main, tags and manual
  # dispatches always run everything. A skipped job counts as passing for
  # `ci-ok`, the one check branch protection requires.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kmod: ${{ steps.decide.outputs.kmod }}
      kpm: ${{ steps.decide.outputs.kpm }}
      builtin: ${{ steps.decide.outputs.builtin }}
      zygisk: ${{ steps.decide.outputs.zygisk }}
      lsposed: ${{ steps.decide.outputs.lsposed }}
      portshide: ${{ steps.decide.outputs.portshide }}
      # Any kernel-side area: the QEMU probes feed kmod, kpm and builtin.
      native: ${{ steps.decide.outputs.native }}
      # The Rust workspace (including app-native crates and zygisk).
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      # For pull requests the filter reads the diff through the API; no checkout.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            # What every area consumes: the hook registry generators, the kernel
            # side shared by kmod/KPM/builtin and the QEMU probes. Turns every
            # area on, QEMU runtime tests included.
            shared:
              - 'kmod/shared/**'
              - 'kmod/test/**'
              - 'kmod/generated/**'
              - 'scripts/codegen*.py'
            # The Rust workspace: the activator every module zip bundles, the
            # app-native crates and zygisk. A change here packages every area
            # (cross-compiles and zips), but the QEMU kernels run nothing from
            # it, so it does not start the QEMU matrix on its own.
            shared_rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              # Shared producer/consumer vectors: run both Rust and Android tests.
              - 'fixtures/app-helper/**'
              - 'scripts/build_lib.py'
              - 'scripts/build-version.py'
            ci:
              - '.github/**'
            # No negation here: in paths-filter a lone `!kmod/kpm/**` matches every
            # path outside kmod/kpm, which made a docs-only change run the kmod jobs.
            # kmod/shared, kmod/test and kmod/generated are `shared` above;
            # kmod/third_party is the KernelPatch submodule (kpm).
            kmod:
              - 'kmod/*'
              - 'kmod/module/**'
            kpm:
              - 'kmod/kpm/**'
            builtin:
              - 'builtin/**'
            zygisk:
              - 'zygisk/**'
            lsposed:
              - 'lsposed/**'
            portshide:
              - 'portshide/**'
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          F_SHARED: ${{ steps.filter.outputs.shared }}
          F_SHARED_RUST: ${{ steps.filter.outputs.shared_rust }}
          F_CI: ${{ steps.filter.outputs.ci }}
          F_KMOD: ${{ steps.filter.outputs.kmod }}
          F_KPM: ${{ steps.filter.outputs.kpm }}
          F_BUILTIN: ${{ steps.filter.outputs.builtin }}
          F_ZYGISK: ${{ steps.filter.outputs.zygisk }}
          F_LSPOSED: ${{ steps.filter.outputs.lsposed }}
          F_PORTSHIDE: ${{ steps.filter.outputs.portshide }}
        run: |
          full=false
          [ "$EVENT" != pull_request ] && full=true
          [ "$F_CI" = true ] && full=true
          case " $LABELS " in *" ci:full "*) full=true ;; esac
          native=false
          rust=false
          # An area is "own" when its sources, the kernel-side shared paths, a
          # label or a full run ask for it; own kernel areas also start the QEMU
          # matrix. The Rust workspace turns every area on for packaging only.
          area() {
            local name=$1 changed=$2 own=false on=false
            if [ "$full" = true ] || [ "$changed" = true ] || [ "$F_SHARED" = true ]; then own=true; fi
            case " $LABELS " in *" area:$name "*) own=true ;; esac
            on=$own
            [ "$F_SHARED_RUST" = true ] && on=true
            echo "$name=$on" >> "$GITHUB_OUTPUT"
            echo "$name: $on"
            [ "$own" = true ] && case "$name" in kmod|kpm|builtin) native=true ;; esac
            [ "$on" = true ] && case "$name" in zygisk|lsposed) rust=true ;; esac
            return 0
          }
          echo "event=$EVENT full=$full shared=${F_SHARED:-n/a} shared_rust=${F_SHARED_RUST:-n/a} labels='$LABELS'"
          area kmod "$F_KMOD"
          area kpm "$F_KPM"
          area builtin "$F_BUILTIN"
          area zygisk "$F_ZYGISK"
          area lsposed "$F_LSPOSED"
          area portshide "$F_PORTSHIDE"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "native: $native"
          if [ "$full" = true ] || [ "$F_SHARED" = true ] || [ "$F_SHARED_RUST" = true ]; then rust=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "rust: $rust"

  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.img.outputs.image }}
      ddkqemu: ${{ steps.img.outputs.ddkqemu }}
      kpmlegacy: ${{ steps.img.outputs.kpmlegacy }}
    steps:
      # `ci` and `ddk-qemu` are floating tags — the publisher overwrites them
      # in place, so nothing to keep in sync here. `kpm-qemu-legacy` is dated:
      # the same literal lives in `qemu-image.yml` (job `build-legacy`) and the
      # two must be bumped together, or CI pulls a tag that was never pushed.
      #
      # The date is a manual marker, not a pin the registry enforces: editing
      # `.github/docker/kpm-qemu-legacy/Dockerfile` re-triggers `qemu-image.yml`
      # and overwrites whatever tag is hardcoded there. Bump the date in BOTH
      # files as part of any change to that Dockerfile or to the kernels
      # `kmod/test/build-source-kernel.sh` bakes in, so an old CI run re-run
      # later still resolves to the image it was green against.
      - id: img
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "image=ghcr.io/${REPO,,}/ci:latest" >> "$GITHUB_OUTPUT"
          echo "ddkqemu=ghcr.io/${REPO,,}/ddk-qemu" >> "$GITHUB_OUTPUT"
          echo "kpmlegacy=ghcr.io/${REPO,,}/kpm-qemu-legacy:aosp-20260918" >> "$GITHUB_OUTPUT"

  # Build native probes from the PR checkout once, then feed those exact
  # binaries to every QEMU job. The long-lived QEMU images also carry fallback
  # copies, but relying on them makes a PR that changes a probe fail until the
  # post-merge image rebuild catches up.
  qemu-native-probes:
    needs: [setup, changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.setup.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build native QEMU probes
        # ifconf + bind-probe feed the kmod/kpm QEMU jobs. iface-ioctl (by-name
        # SIOCGIFHWADDR/ADDR) and bind-probe-compat (armv7, the pre-5.9
        # compat_sock_setsockopt path) additionally feed builtin-qemu — the
        # ddk-qemu image bakes gai/ifconf/bind but not these two.
        run: |
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .artifacts/qemu-native-probes
          "$TC/aarch64-linux-android24-clang" -static -O2 -Wall -Wextra -Werror \
            -o .artifacts/qemu-native-probes/ifconf kmod/test/ifconf-probe.c
          "$TC/aarch64-linux-android24-clang" -static -O2 -Wall -Wextra -Werror \
            -o .artifacts/qemu-native-probes/bind-probe kmod/test/bind-probe.c
          "$TC/aarch64-linux-android24-clang" -static -O2 -Wall -Wextra -Werror \
            -o .artifacts/qemu-native-probes/iface-ioctl kmod/test/iface-ioctl-probe.c
          "$TC/armv7a-linux-androideabi24-clang" -static -O2 -Wall -Wextra -Werror \
            -o .artifacts/qemu-native-probes/bind-probe-compat kmod/test/bind-probe-compat.c
          "$TC/llvm-strip" .artifacts/qemu-native-probes/ifconf \
            .artifacts/qemu-native-probes/bind-probe \
            .artifacts/qemu-native-probes/iface-ioctl \
            .artifacts/qemu-native-probes/bind-probe-compat

      - name: Upload QEMU native probes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qemu-native-probes
          path: .artifacts/qemu-native-probes
          if-no-files-found: error

  # Python style and generated files: seconds on a plain runner, no container.
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: ${{ env.RUFF_VERSION }}
          args: format --check
      - name: ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: ${{ env.RUFF_VERSION }}
          args: check
      - name: Verify generated files are up to date (iface lists + hook registry + help index)
        run: |
          python3 scripts/codegen-interfaces.py
          python3 scripts/codegen-hooks.py
          python3 scripts/gen-help-index.py
          if ! git diff --quiet; then
            echo "::error::a generated file is out of sync. Run scripts/codegen-interfaces.py, scripts/codegen-hooks.py and scripts/gen-help-index.py and commit the result." >&2
            git --no-pager diff
            exit 1
          fi

  # Shell scripts, C formatting and the host-side C tests of the shared kernel logic.
  lint-shell-c:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.setup.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: shellcheck
        # SC2034: `SKIPUNZIP` and the `for i in seq …` counters look unused
        #         to shellcheck — Magisk reads SKIPUNZIP externally, the
        #         counters are loop iterators we don't read by name.
        # SC3043: `local` is "not POSIX" but Android's /system/bin/sh
        #         (mksh on Pixel) supports it, and our module-side
        #         scripts always run there.
        # The inline `apt-get install` is a one-job fallback for the
        # window between this PR landing and the next ci-image rebuild
        # (the Dockerfile bake also adds shellcheck). After the rebuild
        # this no-ops in <1s.
        run: |
          if ! command -v shellcheck >/dev/null; then
            apt-get update -qq && apt-get install -y --no-install-recommends shellcheck >/dev/null
          fi
          shellcheck -x -e SC2034,SC3043 \
            kmod/module/customize.sh kmod/module/post-fs-data.sh kmod/module/service.sh kmod/module/uninstall.sh \
            kmod/kpm/module/customize.sh kmod/kpm/module/post-fs-data.sh kmod/kpm/module/service.sh kmod/kpm/module/uninstall.sh \
            zygisk/module/customize.sh zygisk/module/service.sh zygisk/module/uninstall.sh \
            portshide/module/customize.sh portshide/module/service.sh \
            portshide/module/uninstall.sh \
            scripts/clean-device.sh scripts/update-json.sh \
            kmod/test/run.sh kmod/test/build-kernel.sh kmod/test/init.sh \
            kmod/test/verify-trim-abi.sh \
            kmod/test/run-kpm.sh kmod/test/init-kpm.sh kmod/test/build-source-kernel.sh \
            builtin/test/run.sh builtin/test/build-kernel.sh builtin/test/build-source-kernel.sh
          # The app's root probes. They are assembled from these files plus a
          # variable prelude, so they are checked as POSIX sh (the device shell
          # is mksh) and on their own — a stray apostrophe in one of them once
          # killed the whole batched command silently for a release.
          shellcheck -s sh lsposed/app/src/main/resources/shell/*.sh

      # C (kernel module)
      - name: clang-format
        run: scripts/clang-format-c.sh --check
      - name: kmod iface-list test (host build)
        run: |
          cd kmod
          gcc -O2 -Wall -Werror -o /tmp/test_iface_lists test_iface_lists.c
          /tmp/test_iface_lists
      - name: shared-logic + protocol host tests
        run: |
          cd kmod/shared
          gcc -O2 -Wall -Wextra -Werror -I.. -o /tmp/test_vpnhide_logic test_vpnhide_logic.c
          /tmp/test_vpnhide_logic
          gcc -O2 -Wall -Wextra -Werror -I.. -o /tmp/test_protocol test_protocol.c
          /tmp/test_protocol protocol_vectors.tsv

  # Rust workspace: format, clippy for every target, tests.
  rust:
    needs: [setup, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.setup.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # zygisk builds against the android-inline-hook submodule.
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/cargo-cache
        with:
          key: rust
          targets: |
            target
            zygisk/target
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (protocol + activator)
        run: cargo clippy -p vpnhide_protocol -p vpnhide_protocol_diff -p vpnhide_activator --all-targets -- -D warnings
      - name: rustup target add armv7 (zygisk 32-bit)
        run: rustup target add armv7-linux-androideabi
      - name: clippy (zygisk)
        run: cargo ndk -t arm64-v8a -t armeabi-v7a clippy -p vpnhide_zygisk --tests -- -D warnings
      - name: clippy (app native)
        run: cargo ndk -t arm64-v8a -t armeabi-v7a clippy -p vpnhide_checks -p vpnhide_checks_jni -p vpnhide_app_helper --tests -- -D warnings
      - name: cargo test (workspace)
        run: cargo test -p vpnhide_protocol -p vpnhide_protocol_diff -p vpnhide_activator -p vpnhide_zygisk -p vpnhide_checks -p vpnhide_checks_jni -p vpnhide_app_helper

  kmod-activator:
    needs: [setup, changes]
    if: needs.changes.outputs.kmod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.setup.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/cargo-cache
        with:
          key: kmod-activator

      - name: Build kmod activator
        run: cargo ndk -t arm64-v8a build --release -p vpnhide_activator --bin kmod

      - name: Upload kmod activator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kmod-activator
          path: target/aarch64-linux-android/release/kmod
          if-no-files-found: error

  kmod:
    needs: [changes, kmod-activator]
    if: ${{ !cancelled() && needs.changes.outputs.kmod == 'true' && needs.kmod-activator.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    # Tag here mirrors `DDK_IMAGE_TAG` in kmod/build.py — bump both
    # together so local builds and CI use the exact same image.
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
    env:
      KMI: ${{ matrix.kmi }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download kmod activator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kmod-activator
          path: .artifacts/kmod-activator

      - name: Build and package kernel module
        env:
          VPNHIDE_KMOD_ACTIVATOR: ${{ github.workspace }}/.artifacts/kmod-activator/kmod
        run: python3 kmod/build.py --kmi $KMI --inside-container

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vpnhide-kmod-${{ matrix.kmi }}
          path: vpnhide-kmod-${{ matrix.kmi }}.zip
          if-no-files-found: error

  # Runtime gate: boot a real GKI kernel for each KMI in QEMU and assert the
  # module actually hides VPN state (per-vector A/B), not just that it compiled.
  # Catches register/inlining bugs that source + build checks can't (e.g. the
  # static-function rt_fill_info register issue). Runs in the per-KMI ddk-qemu
  # image (built by qemu-image.yml) which bakes a bootable kernel + its build
  # tree; the module is built here against that tree so it matches the kernel.
  # QEMU runs under TCG (no KVM on hosted runners) — slow but fine. See kmod/test/.
  kmod-qemu:
    needs: [setup, changes, qemu-native-probes]
    if: ${{ !cancelled() && needs.changes.outputs.kmod == 'true' && needs.qemu-native-probes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    container:
      # Lowercased base from setup (GHCR names must be lowercase); credentials
      # because it's a repo-owned (private) package, like the other jobs.
      image: ${{ needs.setup.outputs.ddkqemu }}:${{ matrix.kmi }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      KMI: ${{ matrix.kmi }}
      VPNHIDE_IFC_REQUIRED: "1"
      VPNHIDE_IFC_BIN: ${{ github.workspace }}/.artifacts/qemu-native-probes/ifconf
      VPNHIDE_BIND_REQUIRED: "1"
      VPNHIDE_BIND_BIN: ${{ github.workspace }}/.artifacts/qemu-native-probes/bind-probe
      VPNHIDE_IOC_REQUIRED: "1"
      VPNHIDE_IOC_BIN: ${{ github.workspace }}/.artifacts/qemu-native-probes/iface-ioctl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download QEMU native probes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qemu-native-probes
          path: .artifacts/qemu-native-probes

      - name: Mark QEMU native probes executable
        run: chmod +x "$VPNHIDE_IFC_BIN" "$VPNHIDE_BIND_BIN" "$VPNHIDE_IOC_BIN"

      - name: Build module + QEMU runtime test
        # Build the module against the BAKED kernel tree (VPNHIDE_QEMU_KSRC) so
        # CFI/vermagic/struct layouts match the kernel run.sh boots — building
        # against the GKI kdir mismatches and panics on some KMIs (e.g. 6.12).
        # run.sh boots the baked kernel (VPNHIDE_QEMU_IMAGE/ROOTFS from ENV).
        run: |
          CLANG_BIN="$(ls -d /opt/ddk/clang/*/bin | head -1)"
          make -C kmod KERNEL_SRC="$VPNHIDE_QEMU_KSRC" CLANG_DIR="$CLANG_BIN"
          VPNHIDE_QEMU_KO="$PWD/kmod/vpnhide_kmod.ko" kmod/test/run.sh "$KMI"

  # KPM backend on the SAME baked GKI kernels as kmod-qemu, but patched with
  # KernelPatch instead of insmod (run-kpm.sh). Reuses the ddk-qemu image: the
  # baked Image/rootfs + KernelPatch tool/runtime (VPNHIDE_KP_BIN) make this
  # hermetic. Legacy kernels (4.9/4.14/4.19/5.4) are a separate job/image.
  kpm-qemu:
    needs: [setup, changes, qemu-native-probes]
    if: ${{ !cancelled() && needs.changes.outputs.kpm == 'true' && needs.qemu-native-probes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    container:
      image: ${{ needs.setup.outputs.ddkqemu }}:${{ matrix.kmi }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      KMI: ${{ matrix.kmi }}
      VPNHIDE_IFC_BIN: ${{ github.workspace }}/.artifacts/qemu-native-probes/ifconf
      VPNHIDE_BIND_BIN: ${{ github.workspace }}/.artifacts/qemu-native-probes/bind-probe
      VPNHIDE_IOC_BIN: ${{ github.workspace }}/.artifacts/qemu-native-probes/iface-ioctl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive   # KernelPatch headers needed by `make kpm`

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download QEMU native probes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qemu-native-probes
          path: .artifacts/qemu-native-probes

      - name: Mark QEMU native probes executable
        run: chmod +x "$VPNHIDE_IFC_BIN" "$VPNHIDE_BIND_BIN" "$VPNHIDE_IOC_BIN"

      - name: Build .kpm + KPM QEMU runtime test
        # `make kpm` builds the relocatable .kpm against the KernelPatch
        # submodule (no kernel tree needed). run-kpm.sh patches the baked Image
        # with KernelPatch (VPNHIDE_KP_BIN), embeds the .kpm, and boots the A/B.
        # VPNHIDE_GAI_REQUIRED: the bionic getifaddrs probe is baked into the
        # image, so a skip means it's missing — fail rather than drop coverage.
        env:
          VPNHIDE_GAI_REQUIRED: "1"
          VPNHIDE_IFC_REQUIRED: "1"
          VPNHIDE_BIND_REQUIRED: "1"
          VPNHIDE_IOC_REQUIRED: "1"
        run: |
          CLANG_BIN="$(ls -d /opt/ddk/clang/*/bin | head -1)"
          make -C kmod kpm CLANG_DIR="$CLANG_BIN"
          kmod/test/run-kpm.sh "$KMI"

  # Legacy kernels (4.4/4.9/4.14/4.19/5.4) — the KPM's whole reason to exist
  # (the .ko can't serve them). One image holds all five from-source Images;
  # `-cpu cortex-a57` (those kernels fault on `-cpu max`) with software PAN
  # compiled in, so the user/kernel pointer-domain bug class is caught here on
  # the exact cores where it lives.
  kpm-qemu-legacy:
    needs: [setup, changes, qemu-native-probes]
    if: ${{ !cancelled() && needs.changes.outputs.kpm == 'true' && needs.qemu-native-probes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ver: ["4.4", "4.9", "4.14", "4.19", "5.4"]
    container:
      image: ${{ needs.setup.outputs.kpmlegacy }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      VPNHIDE_IFC_BIN: ${{ github.workspace }}/.artifacts/qemu-native-probes/ifconf
      VPNHIDE_BIND_BIN: ${{ github.workspace }}/.artifacts/qemu-native-probes/bind-probe
      VPNHIDE_IOC_BIN: ${{ github.workspace }}/.artifacts/qemu-native-probes/iface-ioctl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive   # KernelPatch headers needed by `make kpm`

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download QEMU native probes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qemu-native-probes
          path: .artifacts/qemu-native-probes

      - name: Mark QEMU native probes executable
        run: chmod +x "$VPNHIDE_IFC_BIN" "$VPNHIDE_BIND_BIN" "$VPNHIDE_IOC_BIN"

      - name: Build .kpm + legacy KPM QEMU test
        # plain clang from the legacy image; the baked Image + rootfs + KP tools
        # come from ENV (VPNHIDE_QEMU_ROOTFS / VPNHIDE_KP_BIN). The KMI arg is
        # just a label here — VPNHIDE_QEMU_IMAGE picks the from-source kernel.
        # VPNHIDE_GAI_REQUIRED: the bionic getifaddrs probe is baked into the
        # image, so a skip means it's missing — fail rather than drop coverage.
        env:
          VPNHIDE_GAI_REQUIRED: "1"
          VPNHIDE_IFC_REQUIRED: "1"
          VPNHIDE_BIND_REQUIRED: "1"
          VPNHIDE_IOC_REQUIRED: "1"
        run: |
          make -C kmod kpm
          VPNHIDE_QEMU_IMAGE="/opt/qemu/legacy/${{ matrix.ver }}/Image" \
          VPNHIDE_QEMU_CPU=cortex-a57 \
            kmod/test/run-kpm.sh android12-5.10

  # Runtime gate for the built-in (CONFIG_VPNHIDE=y) backend. Unlike kmod/kpm the
  # driver is compiled INTO the kernel, so there is no cheap per-PR object to
  # rebuild against a baked kernel: builtin/scripts/integrate.py integrates the
  # backend into the baked kernel source tree (VPNHIDE_QEMU_KSRC), CONFIG_VPNHIDE
  # is turned on, and the Image is rebuilt with the PR's patches — that rebuilt
  # kernel is what boots. Reuses the ddk-qemu image (clang + qemu + baked kernel
  # tree + Alpine rootfs + baked gai/ifconf/bind probes via VPNHIDE_*_BIN ENV);
  # the by-name-ioctl and armv7 compat-bind probes come from qemu-native-probes.
  #
  # Modern non-LTO KMIs only for now (6.1/6.6/6.12 build fast). The full-LTO
  # 5.10/5.15 and the legacy KMIs (a from-source build, like kpm-qemu-legacy) are
  # a follow-up. NB: ddk-qemu prunes .cmd files, so the Image rebuild is a full
  # kernel compile — keeping .cmd in that image would make it incremental.
  builtin-qemu:
    needs: [setup, changes, qemu-native-probes]
    if: ${{ !cancelled() && needs.changes.outputs.builtin == 'true' && needs.qemu-native-probes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android14-6.1
          - android15-6.6
          - android16-6.12
    container:
      image: ${{ needs.setup.outputs.ddkqemu }}:${{ matrix.kmi }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      KMI: ${{ matrix.kmi }}
      # The kernel build is the job's cost (about 13 of its 15 minutes). ccache
      # keyed per KMI turns a rebuild of an unchanged tree into a link.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      # gai/ifconf/bind come from the image (VPNHIDE_GAI_BIN/IFC_BIN/BIND_BIN are
      # set in the ddk-qemu Dockerfile ENV); the two extra probes come from the
      # artifact. All five REQUIRED so a missing probe fails rather than silently
      # dropping a vector.
      VPNHIDE_GAI_REQUIRED: "1"
      VPNHIDE_IFC_REQUIRED: "1"
      VPNHIDE_BIND_REQUIRED: "1"
      VPNHIDE_IOC_REQUIRED: "1"
      VPNHIDE_BIND32_REQUIRED: "1"
      VPNHIDE_IOC_BIN: ${{ github.workspace }}/.artifacts/qemu-native-probes/iface-ioctl
      VPNHIDE_BIND32_BIN: ${{ github.workspace }}/.artifacts/qemu-native-probes/bind-probe-compat

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.10"

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download QEMU native probes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qemu-native-probes
          path: .artifacts/qemu-native-probes

      - name: Mark QEMU native probes executable
        run: chmod +x "$VPNHIDE_IOC_BIN" "$VPNHIDE_BIND32_BIN"

      - name: Restore kernel ccache
        # restore + explicit save instead of the combined action: the combined
        # post step saves whatever is on disk even for a cancelled job, and one
        # cancelled run left a 1.5 KB cache that shadowed the real one by prefix.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CCACHE_DIR }}
          # A fresh key every run so a save carries today's objects; the prefix
          # restores the newest one for this KMI.
          key: ccache-builtin-${{ matrix.kmi }}-${{ github.run_id }}
          restore-keys: ccache-builtin-${{ matrix.kmi }}-

      - name: ccache
        # The ddk-qemu image installs ccache; an image built before that did not.
        run: |
          if ! command -v ccache >/dev/null; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends ccache >/dev/null
          fi
          ccache --version | head -1
          ccache -z

      - name: Bake CONFIG_VPNHIDE into the kernel + QEMU runtime test
        # integrate.py exports and verifies exact transformations before writing
        # the baked source tree (Git is used only in temporary trees). Merge the two
        # VPNHIDE configs onto the .config the image already built with, rebuild
        # the Image, then boot THAT kernel — VPNHIDE_QEMU_IMAGE is overridden
        # inline because the image otherwise points it at the plain baked kernel.
        #
        # qemu-trim.config is merged here as well, and this is the only job that
        # exercises it per pull request: kmod-qemu and kpm-qemu boot the Image
        # baked into the image, so a trim change reaches them only after
        # qemu-image.yml re-bakes on main. Merging it here is a no-op once the
        # image carries it, and covers the PR until then.
        run: |
          set -euo pipefail
          CLANG_BIN="$(ls -d /opt/ddk/clang/*/bin | head -1)"
          export PATH="$CLANG_BIN:$PATH"
          KSRC="$VPNHIDE_QEMU_KSRC"
          uv run --python 3.12 builtin/scripts/integrate.py apply --kernel "$KSRC" --kmi "$KMI" --output /tmp/vpnhide-review
          printf 'CONFIG_VPNHIDE=y\nCONFIG_VPNHIDE_FS_HIDING=y\n' > /tmp/vpnhide.config
          (
            cd "$KSRC"
            ./scripts/kconfig/merge_config.sh -m .config /tmp/vpnhide.config \
              "$GITHUB_WORKSPACE/kmod/test/qemu-trim.config"
            make ARCH=arm64 LLVM=1 CC="ccache clang" olddefconfig
            grep -E 'CONFIG_VPNHIDE(_FS_HIDING)?=' .config
            make ARCH=arm64 LLVM=1 CC="ccache clang" -j"$(nproc)" Image
          )
          ccache -s
          # Save only when the build compiled something new; a run that hit the
          # cache for everything would just re-upload the same objects.
          misses=$(ccache -s | awk '/^ *Misses:/ {print $2; exit}')
          echo "ccache_save=$([ "${misses:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_ENV"
          VPNHIDE_QEMU_IMAGE="$KSRC/arch/arm64/boot/Image" builtin/test/run.sh "$KMI"

      - name: Save kernel ccache
        # Only a successful build with new objects is worth keeping; a failed or
        # cancelled job must never publish a partial or empty cache.
        if: success() && env.ccache_save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-builtin-${{ matrix.kmi }}-${{ github.run_id }}
      - name: Upload built-in integration review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: builtin-review-${{ matrix.kmi }}
          path: /tmp/vpnhide-review
          if-no-files-found: warn

  # The KPM ships as ONE cross-version flashable module (Magisk/KSU format,
  # APatch reads it too), not a raw .kpm: `make kpm` builds the relocatable
  # object, kmod/kpm/build.py stages the boot scripts + stamps module.prop.
  # The kpm-qemu / kpm-qemu-legacy jobs above are the runtime *test* gate; this
  # job is the *publish* gate.
  kpm:
    needs: [setup, changes]
    if: needs.changes.outputs.kpm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.setup.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive   # KernelPatch headers needed by `make kpm`
          fetch-depth: 0           # get_build_version's `git describe`

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build KPM module zip
        env:
          UPDATE_JSON_URL: https://raw.githubusercontent.com/okhsunrog/vpnhide/main/update-json/update-kpm.json
        run: |
          # clang + lld are needed for the freestanding `-r` link. Bake them
          # into the ci image to drop this fallback (one-job apt, same pattern
          # as the shellcheck step); after the rebuild this no-ops in <1s.
          if ! command -v clang >/dev/null || ! command -v ld.lld >/dev/null; then
            apt-get update -qq && apt-get install -y --no-install-recommends clang lld >/dev/null
          fi
          python3 kmod/kpm/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vpnhide-kpm
          path: vpnhide-kpm.zip
          if-no-files-found: error

  zygisk:
    needs: [setup, changes]
    if: needs.changes.outputs.zygisk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.setup.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/cargo-cache
        with:
          key: zygisk
          targets: zygisk/target

      # armv7 target for the 32-bit zygisk .so. Baked into the CI image, but
      # added here too so this PR is green before the post-merge image rebuild
      # (ci-image.yml runs on push to main, not on PRs). No-op once present.
      - name: rustup target add armv7 (zygisk 32-bit)
        run: rustup target add armv7-linux-androideabi

      - name: Build module zip
        env:
          UPDATE_JSON_URL: https://raw.githubusercontent.com/okhsunrog/vpnhide/main/update-json/update-zygisk.json
        run: |
          cd zygisk
          python3 ./build.py

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vpnhide-zygisk
          path: zygisk/target/vpnhide-zygisk.zip
          if-no-files-found: error

  # Publish gate for the in-tree backend's companion module. Unlike kmod it
  # ships no .ko (the driver is compiled into the user's kernel); build.py only
  # cross-compiles the `builtin` activator (cargo-ndk, arm64) and zips
  # builtin/module/ into one KMI-agnostic vpnhide-builtin.zip. The builtin-qemu
  # jobs are the runtime *test* gate; this is the *publish* gate.
  builtin:
    needs: [setup, changes]
    if: needs.changes.outputs.builtin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.setup.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0           # get_build_version's `git describe`

      - uses: ./.github/actions/cargo-cache
        with:
          key: builtin

      - name: Build module zip
        env:
          UPDATE_JSON_URL: https://raw.githubusercontent.com/okhsunrog/vpnhide/main/update-json/update-builtin.json
        run: python3 builtin/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vpnhide-builtin
          path: vpnhide-builtin.zip
          if-no-files-found: error

  # The Android app: ktlint, detekt, CPD, Android lint, unit tests and the APK
  # in one Gradle invocation, so the checks and the build share one daemon.
  android:
    needs: [setup, changes]
    if: needs.changes.outputs.lsposed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ${{ needs.setup.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/cargo-cache
        with:
          key: android
          targets: target

      # Gradle cache (deps + configuration cache + wrapper). cache-read-only
      # on PRs so only main pushes write the cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: ktlint
        run: ktlint "lsposed/app/src/**/*.kt"
      - name: Set up keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/lsposed/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          else
            echo "ANDROID_KEYSTORE_BASE64 is empty (fork PR); generating an ephemeral keystore. Resulting APK is signed with a throwaway key and is NOT suitable for release."
            KEYSTORE_PASSWORD=ephemeral
            KEY_ALIAS=ephemeral
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 365 \
              -dname "CN=vpnhide-fork-ci, O=vpnhide, C=US"
          fi
          # Build via printf — `%s` swallows the value verbatim with no
          # shell expansion of $, backticks, backslashes, or `!`. Heredoc
          # without single-quoted EOF would re-expand each line.
          {
            printf 'password=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > "$GITHUB_WORKSPACE/lsposed/keystore.properties"

      # Release tags get the full assembleRelease (R8/ProGuard, signed APK
      # ready for the GitHub release). PRs and main pushes get assembleDebug
      # — same code paths exercised, no R8 step (~1.5–2 min faster).
      # `case` instead of `[[`: container jobs default to /bin/sh (POSIX).
      - name: detekt + CPD + Android lint + unit tests + APK
        run: |
          cd "$GITHUB_WORKSPACE/lsposed"
          case "$GITHUB_REF" in
            refs/tags/v*) variant=Release; out=release/app-release.apk ;;
            *)            variant=Debug;   out=debug/app-debug.apk ;;
          esac
          ./gradlew -PvpnhideWarningsAsErrors=true \
            :app:detekt cpdCheck :app:lintDebug :app:testDebugUnitTest "assemble$variant"
          cp "app/build/outputs/apk/$out" "$GITHUB_WORKSPACE/vpnhide.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vpnhide-apk
          path: vpnhide.apk
          if-no-files-found: error

  portshide:
    needs: [setup, changes]
    if: needs.changes.outputs.portshide == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.setup.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/cargo-cache
        with:
          key: portshide

      - name: Package ports module zip
        env:
          UPDATE_JSON_URL: https://raw.githubusercontent.com/okhsunrog/vpnhide/main/update-json/update-ports.json
        run: |
          cd portshide
          python3 ./build-zip.py
          mv vpnhide-ports.zip "$GITHUB_WORKSPACE/vpnhide-ports.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vpnhide-ports
          path: vpnhide-ports.zip
          if-no-files-found: error

  release:
    needs: [builtin-integrator, kmod, kpm, builtin, zygisk, android, portshide]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Only the release job needs write — used by softprops/action-gh-release
    # below to create the draft GitHub release. lint/build jobs run on the
    # workflow-level `contents: read`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG="${{ github.ref_name }}"
          awk -v t="^## ${TAG}\$" '$0~t{flag=1;next} /^## v/{flag=0} flag' \
            CHANGELOG.md > release-notes.md
          echo "=== release-notes.md ==="
          cat release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: true
          files: |
            dist/*.zip
            dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The one status branch protection requires. Green when every job above
  # succeeded or was skipped by `changes`; red on any failure or cancellation,
  # including a job that was skipped because a job it needs failed.
  ci-ok:
    needs:
      - changes
      - builtin-integrator
      - qemu-native-probes
      - lint-python
      - lint-shell-c
      - rust
      - kmod-activator
      - kmod
      - kmod-qemu
      - kpm-qemu
      - kpm-qemu-legacy
      - builtin-qemu
      - kpm
      - zygisk
      - builtin
      - android
      - portshide
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$bad" ]; then
            echo "::error::jobs failed or were cancelled: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          # A gated job skipped because its dependency failed shows as skipped here
          # while the dependency itself shows as failure, so the check above is enough.
