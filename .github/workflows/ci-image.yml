name: CI Image

on:
  push:
    branches: [main]
    paths:
      - .github/docker/ci/Dockerfile
      - .github/workflows/ci-image.yml
      - lsposed/gradle/libs.versions.toml
      - lsposed/gradle/wrapper/gradle-wrapper.properties
      - Cargo.lock
      - zygisk/Cargo.lock
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: img
        env:
          REPO: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPO,,}/ci:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .github/docker/ci
          push: true
          tags: ${{ steps.img.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
