name: QEMU Test Images

# Bakes the per-KMI kmod test images (ddk-min + qemu + a virtio GKI kernel)
# used by the kmod QEMU runtime gate. Kernel commits are pinned in the matrix;
# this runs when the recipe changes, monthly to refresh image dependencies, or
# on demand — not per PR.

on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/docker/ddk-qemu/Dockerfile
      - .github/docker/kpm-qemu-legacy/Dockerfile
      - .github/workflows/qemu-image.yml
      - kmod/test/gai-probe.c
      - kmod/test/ifconf-probe.c
      - kmod/test/bind-probe.c
      - kmod/test/qemu.config
      - kmod/test/build-source-kernel.sh
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      target:
        description: Image set to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ddk
          - legacy

permissions:
  packages: write
  contents: read

concurrency:
  group: qemu-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ddk'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kmi: android12-5.10
            kernel_commit: 1290154c48656bd1012a837076a0fbe379330eb3
          - kmi: android13-5.10
            kernel_commit: 0e7b22b8ec1e944e03b3ab937657aff77f67822e
          - kmi: android13-5.15
            kernel_commit: fe59c182e7da104c649b661eac72fb2a2da0bb01
          - kmi: android14-5.15
            kernel_commit: f9b6dcd0cc376e7e90e86d06ec344202425d6878
          - kmi: android14-6.1
            kernel_commit: 3f3ca1c40482a51cc007a86606ea1516fd4c5077
          - kmi: android15-6.6
            kernel_commit: cf8ba5678385b2b8832ed2e87c035925eb12bc4a
          - kmi: android16-6.12
            kernel_commit: 309759bcbe6d85ba8c702d8e1c83be556304722d
    steps:
      - uses: actions/checkout@v7

      # LTO is per-KMI (gki_defconfig): the android12/13-5.10 + 5.15 kernels are
      # full-LTO and disk/RAM-hungry to build; 6.1+ are LTO_NONE and light.
      # Reclaim ~30 GB of preinstalled toolchains for the kernel tree, and add
      # swap as headroom for the full-LTO vmlinux.o link on a 16 GB runner.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - name: Add swap for the full-LTO link
        run: |
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h && df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: img
        env:
          REPO: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPO,,}/ddk-qemu:${{ matrix.kmi }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/ddk-qemu/Dockerfile
          build-args: |
            KMI=${{ matrix.kmi }}
            KERNEL_COMMIT=${{ matrix.kernel_commit }}
          push: true
          tags: ${{ steps.img.outputs.image }}
          # Keep reading any existing per-KMI GHA cache entries while they
          # expire, but do not export new ones. The kernel-build layers are
          # huge and recent runs spent minutes exporting cache with little
          # practical reuse.
          cache-from: type=gha,scope=ddk-qemu-${{ matrix.kmi }}

  # One image with the 4 from-source legacy kernels (4.9/4.14/4.19/5.4)
  # for the KPM harness. Not a matrix — a single image with all four Images,
  # built by build-source-kernel.sh (Bootlin gcc, no DDK, no kernel tree).
  build-legacy:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'legacy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Four gcc AOSP kernel builds are disk-hungry.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Unlike the per-KMI images above (tagged by KMI, overwritten in place),
      # this one is dated so a CI run stays reproducible. The same literal is
      # consumed by the `setup` job in `ci.yml` — bump both together, or CI
      # pulls a tag that was never pushed.
      #
      # Nothing in the registry enforces the date: `push` to main with a change
      # under `paths` re-runs this job and overwrites whatever tag is hardcoded
      # here. So bump it as part of any change to the Dockerfile or to the
      # kernels `kmod/test/build-source-kernel.sh` bakes in. Expect the legacy
      # CI jobs to fail on that one push until this job finishes publishing the
      # new tag.
      - id: img
        env:
          REPO: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPO,,}/kpm-qemu-legacy:aosp-20260918" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/kpm-qemu-legacy/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.image }}
          # Same tradeoff as the per-KMI images: import old cache if present,
          # skip the expensive export path.
          cache-from: type=gha,scope=kpm-qemu-legacy
