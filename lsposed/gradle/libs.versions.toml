[versions]
agp = "9.3.1"
kotlin = "2.4.10"
compose-bom = "2026.08.00"
# Pinned above the BOM (1.4.0): Material 3 Expressive theme APIs
# (MaterialExpressiveTheme, MotionScheme) are public only from 1.5.0-alpha.
# Requires AGP 9.1+ (we're on 9.3.1 from google()), mirrors ImageToolbox.
material3 = "1.5.0-alpha26"
activity-compose = "1.13.0"
core-ktx = "1.19.0"
datastore = "1.2.1"
material-kolor = "5.0.0"
squircle-shape = "5.4.0"
detekt = "1.23.8"
cpd = "3.5"
kotlinx-serialization-json = "1.11.0"
commonmark = "0.30.0"
work = "2.11.2"
# Tooling: dependency-update reporting + version-catalog rewriting.
# Run `./gradlew dependencyUpdates` for a report, or
# `./gradlew versionCatalogUpdate --interactive` to stage changes for review.
ben-manes-versions = "0.61.0"
version-catalog-update = "1.1.1"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
commonmark = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { group = "org.commonmark", name = "commonmark-ext-gfm-tables", version.ref = "commonmark" }
material-kolor = { group = "com.materialkolor", name = "material-kolor", version.ref = "material-kolor" }
squircle-shape = { group = "com.stoyanvuchev", name = "squircle-shape-android", version.ref = "squircle-shape" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-atomicfu = { id = "org.jetbrains.kotlin.plugin.atomicfu", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
cpd = { id = "de.aaschmid.cpd", version.ref = "cpd" }
ben-manes-versions = { id = "io.github.ben-manes.versions", version.ref = "ben-manes-versions" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }
