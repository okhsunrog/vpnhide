[versions]
agp = "9.2.1"
kotlin = "2.4.0"
compose-bom = "2026.06.00"
# Pinned above the BOM (1.4.0): Material 3 Expressive theme APIs
# (MaterialExpressiveTheme, MotionScheme) are public only from 1.5.0-alpha.
# Requires AGP 9.1+ (satisfied via the local Gobley fork), mirrors ImageToolbox.
material3 = "1.5.0-alpha22"
activity-compose = "1.13.0"
core-ktx = "1.19.0"
datastore = "1.2.1"
material-kolor = "4.1.1"
squircle-shape = "5.3.0"
gobley = "0.3.8-agp9.1.okhsunrog1"
detekt = "1.23.8"
cpd = "3.5"
kotlinx-serialization-json = "1.9.0"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
material-kolor = { group = "com.materialkolor", name = "material-kolor", version.ref = "material-kolor" }
squircle-shape = { group = "com.stoyanvuchev", name = "squircle-shape-android", version.ref = "squircle-shape" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-atomicfu = { id = "org.jetbrains.kotlin.plugin.atomicfu", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
gobley-cargo = { id = "dev.gobley.cargo", version.ref = "gobley" }
gobley-uniffi = { id = "dev.gobley.uniffi", version.ref = "gobley" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
cpd = { id = "de.aaschmid.cpd", version.ref = "cpd" }
