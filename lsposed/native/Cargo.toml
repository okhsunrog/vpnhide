[package]
name = "vpnhide_checks"
version = "1.2.5"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "vpnhide_checks"
# cdylib: loaded in-process via System.loadLibrary for the app-view JNI probe.
# rlib:   linked by the `vhprobe` bin (root-exec ground-truth probe).
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vhprobe"
path = "src/bin/vhprobe.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vpnhide_apatch_abi = { path = "../../crates/apatch-abi" }
# Minimal JNI surface: one exported function returning the checks as JSON.
jni = { version = "0.22.4", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
# Unwinding, not abort: this cdylib is loaded into the app process and its JNI
# entry catches the unwind (see install_panic_hook / with_env), so a panic in a
# probe surfaces as a Java exception instead of killing the user's app. Costs
# ~39 KB of unwind tables on arm64 — the only ABI we ship.
panic = "unwind"

[profile.dev]
# Host unit tests need unwinding too — abort would mask the panic-hook path
# this crate now relies on.
panic = "unwind"
