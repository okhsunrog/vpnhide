[package]
name = "vpnhide_core_client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Persistent multiplexed app transport for the core RPC contract."

[dependencies]
tarpc = { version = "0.38.0", features = ["serde-transport", "tokio1", "unix"] }
tokio = { version = "1.54.1", features = ["net", "sync", "time"] }
tokio-serde = { version = "0.9.0", features = ["json"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
vpnhide_core_rpc = { version = "0.0.0", path = "../core-rpc" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
