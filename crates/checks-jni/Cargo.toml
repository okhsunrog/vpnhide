[package]
name = "vpnhide_checks_jni"
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thin JNI adapter for vpnhide native checks."

[lib]
# Preserve System.loadLibrary("vpnhide_checks") and the packaged .so name.
name = "vpnhide_checks"
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.22.4", default-features = false }
libc = "0.2"
vpnhide_checks = { path = "../checks" }
