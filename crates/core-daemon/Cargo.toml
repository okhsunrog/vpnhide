# The persistent privileged core, speaking the shared core-rpc contract.
# The APK uses the separate core-client crate and never links this engine.
[package]
name = "vpnhide_core_daemon"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "vpnhide persistent root core: durable command engine and UDS RPC server."

[lib]
name = "vpnhide_core_daemon"
path = "src/lib.rs"

[[bin]]
name = "vpnhide-core"
path = "src/main.rs"

[dependencies]
vpnhide_core_rpc = { path = "../core-rpc" }
vpnhide_checks = { path = "../checks" }
libc = "0.2"
flate2 = "1"
sha2 = "0.10"
tarpc = { version = "0.38", features = ["serde-transport", "tokio1", "unix"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "signal"] }
tokio-serde = { version = "0.9", features = ["json"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
vpnhide_activator = { version = "1.2.5", path = "../activator" }
vpnhide_protocol = { version = "1.2.5", path = "../protocol" }
vpnhide_core_client = { version = "0.1.0", path = "../core-client" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
