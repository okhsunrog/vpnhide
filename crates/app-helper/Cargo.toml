[package]
name = "vpnhide_app_helper"
version = "1.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Root observations, the app's core client, and supervised coupled commands for vpnhide."

[[bin]]
name = "vhhelper"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vpnhide_apatch_abi = { path = "../apatch-abi" }
vpnhide_checks = { path = "../checks" }
vpnhide_core_daemon = { path = "../core-daemon" }
vpnhide_core_rpc = { path = "../core-rpc" }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
