[package]
name = "vpnhide_tooling"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vpnhide-tooling"
path = "src/main.rs"

[dependencies]
vpnhide_bounded_process = { path = "../bounded-process" }
vpnhide_artifact_model = { path = "../artifact-model", features = ["archives"] }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"

[dev-dependencies]
vpnhide_artifact_model = { path = "../artifact-model", features = ["fixtures", "archives"] }
vpnhide_package_trust = { path = "../package-trust" }
tempfile = "3"
