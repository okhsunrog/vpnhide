# THROWAWAY SPIKE (core-2.0 §12 step 1a). Not shipped in the APK, not a module.
# Purpose: on a real device, prove that a uid-0 NETLINK_ROUTE listener catches
# every VPN up/down edge promptly, without misses, and recomputes "is this uid
# routed through the VPN" from the shared checks primitive. Delete once the
# observation question is answered and the daemon owns this loop.
[package]
name = "vpnhide_netlink_spike"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Throwaway core-2.0 spike: netlink-driven VPN-state observation."

[[bin]]
name = "netlink-spike"
path = "src/main.rs"

[dependencies]
libc = "0.2"
vpnhide_checks = { path = "../checks" }
