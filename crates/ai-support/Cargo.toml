[package]
name = "vpnhide_ai_support"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Server-side support assistant for VPN Hide. Sketch: snapshot contract, read-only tools, HTTP stubs."

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "vpnhide_ai_support"

[[bin]]
name = "vpnhide-ai-support"
path = "src/main.rs"
